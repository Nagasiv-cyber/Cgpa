name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (SPA / static mode — Nitro/SSR disabled)
        run: bun run build
        env:
          # Tells vite.config.ts to skip Nitro/SSR and emit a pure client bundle
          PAGES_BUILD: "true"
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Create 404.html for SPA deep-link routing
        # GitHub Pages returns a real 404 for unknown paths.
        # Copying index.html as 404.html lets TanStack Router handle all routes client-side.
        run: cp dist/client/index.html dist/client/404.html

      - name: Copy CNAME for custom domain
        run: cp CNAME dist/client/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

