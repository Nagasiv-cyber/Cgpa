name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (SPA / static mode — Nitro/SSR disabled)
        run: npm run build
        env:
          # Tells vite.config.ts to skip Nitro/SSR and emit a pure client bundle
          PAGES_BUILD: "true"
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Create 404.html for SPA deep-link routing
        # GitHub Pages returns a real 404 for unknown paths.
        # Copying index.html as 404.html lets TanStack Router handle all routes client-side.
        run: cp .output/public/index.html .output/public/404.html

      - name: Copy CNAME for custom domain
        run: cp CNAME .output/public/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
