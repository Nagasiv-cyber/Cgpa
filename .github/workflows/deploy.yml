name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Node server for static HTML generation)
        # Use node-server preset to allow booting a temporary server to render HTML
        run: bun run vite build --config vite.config.pages.ts --base=/Cgpa/
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Generate Static HTML
        # Boot the built node server and curl the HTML, because Tanstack Start 
        # requires the SSR handler to emit the initial index.html for SPAs.
        run: |
          node .output/server/index.mjs &
          SERVER_PID=$!
          npx wait-on http://localhost:3000
          curl -s http://localhost:3000/ > .output/public/index.html
          cp .output/public/index.html .output/public/404.html
          kill $SERVER_PID


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

